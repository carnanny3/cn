name: car_nanny
description: Car Nanny — the consumer mobile app for the car-ownership platform.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.1
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  # Pinned to 10.x, which is the only range that builds here. Its Android side
  # No file_picker: every published version conflicts with this project's
  # toolchain (AGP 9.0.1 + android.builtInKotlin=false + compileSdk 36).
  # 11.x's Kotlin sources never compile, 10.x pins compileSdk 34, and 8.x still
  # uses the removed v1 Android embedding. Documents are captured with
  # image_picker instead; the API still accepts PDFs, so only the in-app picker
  # is affected. See lib/core/api/file_pickers.dart.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo_icon.png
